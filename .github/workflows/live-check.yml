name: live-check

# Opens the deployed app in a real browser and checks the parcel map on both
# tile sources (scripts/live-check/map.mjs). Run by hand. Needs no secret: it
# uses the public site, as a visitor would.

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: the deployed app to check
        required: true
        default: https://optimizer-omega-three.vercel.app
      check:
        description: map (both tile sources), search (the five audit parcels into the planner) or homes (stock plans per lot and a one-lot home change; needs app_ref)
        required: true
        default: map
        type: choice
        options: [map, search, homes, views, decision]
      app_ref:
        description: optional - build this git ref on the runner and check it against the live database instead of app_url (for a branch whose preview is login-protected)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Serve a branch against the live database
        if: inputs.app_ref != ''
        env:
          APP_REF: ${{ inputs.app_ref }}
          VITE_SUPABASE_URL: ${{ secrets.BATTERY_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.BATTERY_SUPABASE_ANON_KEY }}
        run: |
          git fetch --depth=1 origin "$APP_REF"
          git worktree add ../app FETCH_HEAD
          cd ../app && npm ci --no-audit --no-fund
          nohup npx vite --port 5199 --strictPort > ../vite.log 2>&1 &
          npx wait-on -t 90000 http://localhost:5199
          echo "APP_URL_OVERRIDE=http://localhost:5199" >> "$GITHUB_ENV"
      - name: Check the live map
        if: inputs.check == 'map'
        env:
          APP_URL: ${{ env.APP_URL_OVERRIDE || inputs.app_url }}
          OUT: live-check
        run: node scripts/live-check/map.mjs
      - name: Check parcel search into the planner
        if: inputs.check == 'search'
        env:
          APP_URL: ${{ env.APP_URL_OVERRIDE || inputs.app_url }}
          OUT: live-check
        run: node scripts/live-check/search.mjs
      - name: Check stock plans per lot and a one-lot home change
        if: inputs.check == 'homes'
        env:
          APP_URL: ${{ env.APP_URL_OVERRIDE || inputs.app_url }}
          OUT: live-check
        run: node scripts/live-check/homes.mjs
      - name: Check 3D views, cameras and timings on a laptop viewport
        if: inputs.check == 'views'
        env:
          APP_URL: ${{ env.APP_URL_OVERRIDE || inputs.app_url }}
          OUT: live-check
        run: node scripts/live-check/views.mjs
      - name: Check one decision state (search, impervious, product word, access basis)
        if: inputs.check == 'decision'
        env:
          APP_URL: ${{ env.APP_URL_OVERRIDE || inputs.app_url }}
          OUT: live-check
        run: node scripts/live-check/decision.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-check-${{ github.run_id }}
          path: live-check/
          retention-days: 14
