name: CI

on:
  push:
    branches: [main, fix/planner-parity]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: TypeScript type check
        run: npm run typecheck
        
      - name: ESLint
        run: npm run lint
        
      - name: Unit tests
        run: npm run test

      # DB acceptance battery (audit 2026-07-21 CC-1): live solver, read-only
      # (p_persist=false), fails the merge on any unexpected error or any
      # capture below scripts/db-battery/floors.json. ENFORCING once the
      # secrets exist; loud skip until then (a missing secret must not fail
      # every fork PR). Geometry validity is battery-gate.yml's job.
      - name: DB acceptance battery (solver floors)
        env:
          BATTERY_SUPABASE_URL: ${{ secrets.BATTERY_SUPABASE_URL }}
          BATTERY_SUPABASE_ANON_KEY: ${{ secrets.BATTERY_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$BATTERY_SUPABASE_URL" ] || [ -z "$BATTERY_SUPABASE_ANON_KEY" ]; then
            echo "::warning::DB battery SKIPPED — add BATTERY_SUPABASE_URL / BATTERY_SUPABASE_ANON_KEY repo secrets to enforce solver floors on every PR."
            exit 0
          fi
          node scripts/db-battery/run.mjs

      - name: E2E tests
        run: |
          if [ "$RUN_E2E" = "true" ]; then
            npx playwright install --with-deps
            npm run e2e:ci
          else
            echo "Skipping E2E tests — set RUN_E2E=true to enable."
            echo "(The Playwright suite needs Mapbox/Supabase secrets and a running app;"
            echo " several specs also target routes/test-ids that don't exist yet.)"
          fi
        
      - name: SQL smoke tests
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            npm run db:smoke
          else
            echo "Skipping SQL smoke tests - no database URL provided"
          fi
        
      - name: Security audit (advisory)
        # The previous step ran `npx @google/osv-scanner`, but OSV-Scanner is a Go
        # binary, not an npm package — the install 404s. Use npm audit as a
        # non-blocking advisory signal until a proper OSV action is wired up.
        run: npm audit --audit-level=high || true
